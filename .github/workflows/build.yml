name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        shell: bash
        run: gradle assembleDebug --stacktrace -PbuildNumber=${{ github.run_number }} -PgithubRepo=${{ github.repository }} 2>&1 | tee build.log
      - name: Mostrar errores (si falla)
        if: failure()
        run: |
          echo "## Errores de compilación" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong" -A2 build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-remoto-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
      # Publica el APK como Release: de ahí lo descarga la app cuando pide actualizar.
      - name: Publicar release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
